<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>คิดต้นทุน ตั้งราคา</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap">
<style>
/* Layout: one slide at a time. Projector = wide column with big type; phone = same content reflowed to one column, thumb-height buttons, fixed bottom nav.
   Palette from natural-dyed eri silk: indigo ink, lac red, saffron, teal-green. Products are told apart by colour AND badge letter. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#E7EBF4; --fg:#18213A; --muted:#4B5673; --line:#C5CDE0;
  --accent:#26418F; --accent-ink:#FFFFFF; --accent-soft:#DCE4F8; --input:#FFFFFF; --focus:#C46A00;
  --p1:#A8302B; --p1s:#F6DEDC; --p2:#8A5A00; --p2s:#FBEBC8; --p3:#1F6B5C; --p3s:#D5EEE8;
  --ok:#17673A; --oks:#D9F0E2; --warn:#7A4E00; --warns:#FBEBC8; --bad:#A8302B; --bads:#F8DDDB;
  --f-display:'Prompt','Noto Sans Thai','Tahoma',sans-serif; --f-body:'Sarabun','Noto Sans Thai','Tahoma',sans-serif;
  --fs:clamp(19px,calc(1.1vw + 14px),30px); --s:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1426; --surface:#182039; --surface2:#212B49; --fg:#ECEFF8; --muted:#A9B3CF; --line:#33405F;
  --accent:#9DB3F5; --accent-ink:#0F1426; --accent-soft:#26335C; --input:#0F1426; --focus:#F0C365;
  --p1:#F29A93; --p1s:#3A1F27; --p2:#F0C365; --p2s:#3A2E15; --p3:#7FD3BE; --p3s:#153A35;
  --ok:#7FD9A0; --oks:#143323; --warn:#F0C365; --warns:#3A2E15; --bad:#F29A93; --bads:#3A1F27; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1426; --surface:#182039; --surface2:#212B49; --fg:#ECEFF8; --muted:#A9B3CF; --line:#33405F;
  --accent:#9DB3F5; --accent-ink:#0F1426; --accent-soft:#26335C; --input:#0F1426; --focus:#F0C365;
  --p1:#F29A93; --p1s:#3A1F27; --p2:#F0C365; --p2s:#3A2E15; --p3:#7FD3BE; --p3s:#153A35;
  --ok:#7FD9A0; --oks:#143323; --warn:#F0C365; --warns:#3A2E15; --bad:#F29A93; --bads:#3A1F27; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:calc(var(--fs)*var(--s));line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;min-height:100dvh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}

.top{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:.5em 1em;align-items:center;justify-content:space-between;padding-block:.7em .4em}
.brand{font-family:var(--f-display);font-weight:600;font-size:.85em;color:var(--muted)}
.tools{display:flex;gap:.4em;flex-wrap:wrap}
.tools button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.3em .8em;min-height:2.6em;font-size:.8em;font-weight:600}
.tools button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.prog{max-width:1240px;margin:0 auto;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}

main{max-width:1240px;margin:0 auto;padding-block:1em 7.5em;outline:none}
.slide{display:grid;gap:.9em;align-content:start}
.kicker{font-family:var(--f-display);font-weight:600;font-size:.8em;color:var(--accent)}
h1{font-family:var(--f-display);font-weight:600;font-size:calc(1.45em + 1vw);line-height:1.3;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:1.15em;margin:0}
h3{font-family:var(--f-display);font-weight:600;font-size:1em;margin:0}
p{margin:0}
.lead{font-size:1.1em;max-width:34em}
.small{font-size:.8em}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15em),1fr));gap:.8em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1em;display:grid;gap:.4em;align-content:start;min-width:0}
.card .big{font-family:var(--f-display);font-weight:600;font-size:1.25em;line-height:1.3}
.badge{display:inline-grid;place-items:center;width:2em;height:2em;border-radius:50%;font-family:var(--f-display);font-weight:700;background:var(--c);color:var(--bg);flex:none}
.p1{--c:var(--p1);--cs:var(--p1s)} .p2{--c:var(--p2);--cs:var(--p2s)} .p3{--c:var(--p3);--cs:var(--p3s)}
.pname{display:flex;gap:.6em;align-items:center}
.pname b{font-family:var(--f-display);color:var(--c)}
.callout{background:var(--accent-soft);border-radius:12px;padding:.8em 1em;max-width:40em}
.stat{font-family:var(--f-display);font-weight:700;font-size:2em;line-height:1.1;color:var(--accent)}
.steps{display:grid;gap:.7em;counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:auto 1fr;gap:.9em;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.8em 1em;align-items:start}
.steps li::before{content:counter(s);display:grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700}
.steps b{font-family:var(--f-display)}
.tag{display:inline-block;font-size:.72em;font-weight:600;border-radius:99px;padding:.05em .7em;background:var(--surface2);color:var(--muted);white-space:nowrap}
.hero{font-family:var(--f-display);font-weight:600;font-size:calc(1.25em + 1.4vw);line-height:1.4;max-width:22em;text-wrap:balance}

/* cover */
.k-cover{padding-top:1em;gap:1.1em}
.k-cover h1{font-size:calc(1.7em + 1.6vw);max-width:16em}
.meta{display:grid;gap:.15em}
.meta b{font-family:var(--f-display)}

/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1em;display:grid;gap:.7em}
.q .qt{font-weight:600;font-size:1.05em}
.opts{display:grid;gap:.5em}
.opt{display:flex;gap:.7em;text-align:left;align-items:center;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:.6em .9em;min-height:3em;width:100%}
.opt .m{width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:.85em;border:2px solid var(--muted)}
.opt.right{border-color:var(--ok);background:var(--oks)} .opt.right .m{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bads)} .opt.wrong .m{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.exp{border-radius:10px;padding:.6em .9em;background:var(--surface2)}
.score{font-family:var(--f-display);font-weight:600}

/* checklist */
.chk{display:grid;gap:.5em}
.chk label{display:grid;grid-template-columns:auto 1fr;gap:.8em;align-items:start;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:.6em .9em;cursor:pointer}
.chk input{width:1.5em;height:1.5em;margin:.15em 0 0;accent-color:var(--accent)}
.chk label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.chk small{display:block;color:var(--muted)}

/* calculator */
.calc{display:grid;gap:1em}
.tabs{display:flex;gap:.5em;flex-wrap:wrap}
.tabs button{display:flex;gap:.5em;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:.4em .9em .4em .5em;min-height:3em;font-weight:600}
.tabs button[aria-selected="true"]{border-color:var(--c);background:var(--cs)}
.part{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1em;display:grid;gap:.8em}
.part>h2{display:flex;gap:.5em;align-items:baseline;flex-wrap:wrap}
.rows{display:grid;gap:.5em}
.row{display:grid;grid-template-columns:minmax(0,1fr) 6.5em auto;gap:.5em;align-items:center}
.row .nm{min-width:0;display:grid;gap:.1em}
.row .nm span.t{font-weight:500}
input[type=number],input[type=text]{width:100%;min-width:0;min-height:2.7em;padding:.3em .6em;border:2px solid var(--accent);border-radius:10px;background:var(--input);color:var(--fg);font-variant-numeric:tabular-nums}
input[type=number]{text-align:right}
input[type=range]{width:100%;accent-color:var(--accent);height:2.2em}
.ib{background:none;border:1px solid var(--line);border-radius:10px;min-width:2.6em;min-height:2.6em;color:var(--muted);font-size:.9em}
.btn{background:var(--surface);border:2px solid var(--accent);color:var(--accent);border-radius:12px;padding:.4em 1em;min-height:2.8em;font-weight:600}
.btn.sec{border-color:var(--line);color:var(--muted)}
.eq{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:.5em;align-items:center}
.eq .op{font-family:var(--f-display);font-size:1.6em;color:var(--muted);text-align:center}
.eq .t{background:var(--bg);border-radius:12px;padding:.6em .8em;display:grid;gap:.1em;min-width:0}
.eq .t>span{font-size:.8em;color:var(--muted)}
.eq .t b{font-family:var(--f-display);font-size:1.6em;line-height:1.2;font-variant-numeric:tabular-nums}
.eq .t i{font-style:normal;font-size:.8em;color:var(--muted)}
.eq .t.hi{background:var(--accent);color:var(--accent-ink)}
.eq .t.hi>span,.eq .t.hi i{color:var(--accent-ink);opacity:.9}
.eq .t input{min-height:2.2em}
.kv{display:grid;gap:.3em}
.kv>div{display:flex;justify-content:space-between;gap:1em;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:.25em}
.kv b{font-family:var(--f-display);font-variant-numeric:tabular-nums;text-align:right}
.seg{display:flex;gap:.4em;flex-wrap:wrap;align-items:center}
.seg button{background:var(--bg);border:2px solid var(--line);border-radius:10px;min-width:3em;min-height:2.6em;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lab{display:flex;justify-content:space-between;gap:1em;font-weight:600;align-items:baseline}
.chip{display:inline-block;border-radius:10px;padding:.3em .8em;font-weight:600;font-size:.9em}
.chip.ok{background:var(--oks);color:var(--ok)} .chip.warn{background:var(--warns);color:var(--warn)} .chip.bad{background:var(--bads);color:var(--bad)} .chip.info{background:var(--accent-soft);color:var(--accent)}
.tblwrap{overflow-x:auto;border-radius:12px}
table{border-collapse:collapse;width:100%;background:var(--surface);font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:.45em .7em;text-align:left;vertical-align:top}
td.n,th.n{text-align:right}
th{background:var(--surface2);font-family:var(--f-display);font-weight:600}
tfoot td{font-weight:700;background:var(--accent-soft)}
.blank td{height:2.2em}
.timer{font-family:var(--f-display);font-weight:700;font-size:calc(2.5em + 3vw);font-variant-numeric:tabular-nums;line-height:1.1}

/* nav */
.bar{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr auto 1fr;gap:.6em;align-items:center;background:var(--surface);border-top:1px solid var(--line);
  padding:.6em max(16px,env(safe-area-inset-left,0px)) calc(.6em + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));z-index:5}
.bar button{min-height:3.1em;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:600;padding:.2em .8em}
.bar button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bar button:disabled{opacity:.4}
.bar button{white-space:nowrap}
.bar .pg{border:none;background:none;min-width:5.5em}

/* teacher notes */
.notes{display:none;background:var(--warns);color:var(--fg);border:1px dashed var(--warn);border-radius:12px;padding:.7em 1em;font-size:.85em}
.notes b{color:var(--warn);margin-right:.4em}
body.inst .notes{display:block}

/* contents */
.toc{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding-block:max(1em,env(safe-area-inset-top,0px)) calc(2em + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toc>div{max-width:760px;margin:0 auto;display:grid;gap:.4em}
.toc h2{margin-top:.8em}
.toc .it{display:grid;grid-template-columns:2.2em 1fr;gap:.5em;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.5em .8em;min-height:2.8em;width:100%}
.toc .it[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}

@media (max-width:640px){
  .eq{grid-template-columns:1fr}
  .eq .op{line-height:1}
  .row{grid-template-columns:minmax(0,1fr) 5.6em auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="brand">ไหมอีรี่ · คิดต้นทุน ตั้งราคา</div>
  <div class="tools">
    <button id="bToc" type="button">สารบัญ</button>
    <button id="bSm" type="button" aria-label="ลดขนาดตัวอักษร">ก−</button>
    <button id="bLg" type="button" aria-label="เพิ่มขนาดตัวอักษร">ก+</button>
  </div>
</header>
<div class="prog" aria-hidden="true"><i id="progBar"></i></div>
<main id="stage" tabindex="-1"></main>
<nav class="bar" aria-label="เปลี่ยนหน้า">
  <button id="bPrev" type="button">‹ ก่อนหน้า</button>
  <button id="bNum" type="button" class="pg" aria-label="เปิดสารบัญ">1 / 30</button>
  <button id="bNext" type="button" class="primary">ถัดไป ›</button>
</nav>
<div id="toc" class="toc" hidden></div>

<script>
(function(){
'use strict';
var KEY='eri-cost-v1';
var GROUP={mat:'วัตถุดิบ',pack:'บรรจุภัณฑ์',lab:'แรงงาน',oth:'อื่นๆ'};
var DEF={
  fresh:{name:'น้ำพริกสดดักแด้ไหมอีรี่',short:'น้ำพริกสด',sub:'สูตรคั่วหอม',unit:'กระปุก',badge:'ก',cls:'p1',made:50,
    items:[['ดักแด้ไหมอีรี่',500,'mat'],['พริก กระเทียม หอมแดง',300,'mat'],['น้ำปลา น้ำตาล น้ำมัน',200,'mat'],['กระปุก ฝา ซีล ฉลาก (50 ชุด)',250,'pack'],['ค่าแรง 2 คน',200,'lab'],['แก๊ส ไฟ น้ำ',150,'oth']]},
  dry:{name:'น้ำพริกแห้งกรอบดักแด้ไหมอีรี่',short:'น้ำพริกแห้งกรอบ',sub:'สูตรคั่วแห้ง',unit:'กระปุก',badge:'ข',cls:'p2',made:40,
    items:[['ดักแด้ไหมอีรี่',400,'mat'],['เครื่องเทศและเครื่องปรุง',200,'mat'],['กระปุก ฟอยล์ซีล ฉลาก (40 ชุด)',240,'pack'],['ค่าแรง 2 คน',200,'lab'],['แก๊ส ไฟ น้ำ',160,'oth']]},
  crisp:{name:'ข้าวเกรียบดักแด้ไหมอีรี่',short:'ข้าวเกรียบดักแด้',sub:'มัญจาพองกรอบ',unit:'ถุง',badge:'ค',cls:'p3',made:100,
    items:[['ดักแด้ไหมอีรี่',300,'mat'],['แป้งและเครื่องปรุง',300,'mat'],['น้ำมันทอด',200,'mat'],['ถุงและฉลาก (100 ใบ)',200,'pack'],['ค่าแรง 4 คน',400,'lab'],['แก๊ส ไฟ น้ำ',100,'oth']]}
};
var PIDS=['fresh','dry','crisp'];
var CHECKS=[
 ['ต้นทุนวัตถุดิบหลัก','ดักแด้ไหมอีรี่ พริก กระเทียม หอมแดง'],
 ['ต้นทุนเครื่องปรุง','น้ำปลา น้ำตาล เกลือ น้ำมัน เครื่องเทศ'],
 ['ต้นทุนบรรจุภัณฑ์','กระปุก ฝาปิด ซีล ฉลาก ถุง'],
 ['ค่าแรงงาน','ล้างวัตถุดิบ ปรุง บรรจุ'],
 ['ค่าสาธารณูปโภค','ค่าแก๊ส ค่าไฟฟ้า ค่าน้ำ'],
 ['ต้นทุนการเก็บรักษา','ตู้เย็น น้ำแข็ง กล่องเก็บความเย็น'],
 ['ค่าขนส่ง','ค่าน้ำมัน ค่าส่งพัสดุ ค่ากล่องขนส่ง'],
 ['ค่าใช้จ่ายด้านการตลาด','ถ่ายภาพ โฆษณา สินค้าทดลอง ส่วนลด'],
 ['ค่าธรรมเนียมการจำหน่าย','ค่าแพลตฟอร์ม ค่าพื้นที่ขาย ค่าฝากขาย'],
 ['ต้นทุนความสูญเสีย','วัตถุดิบเสีย น้ำหนักลดหลังปรุง สินค้าหมดอายุ']
];

/* ---------- state ---------- */
function mkP(pid){var d=DEF[pid];return{items:d.items.map(function(x){return{n:x[0],v:x[1],g:x[2]}}),made:d.made,profit:35,step:5,price:null,fee:10}}
function mkS(){var p={};PIDS.forEach(function(k){p[k]=mkP(k)});return{p:p,quiz:{},check:[],am:{fresh:{p:1200,r:60},dry:{p:1200,r:60},crisp:{p:1200,r:60}},lab:{fresh:{n:2,r:100},dry:{n:2,r:100},crisp:{n:4,r:100}},scale:1,tab:'fresh'}}
var S=mkS();
try{var raw=JSON.parse(localStorage.getItem(KEY)||'null');
  if(raw&&typeof raw==='object'){
    PIDS.forEach(function(k){var r=raw.p&&raw.p[k];if(r&&Array.isArray(r.items)&&r.items.length&&typeof r.made==='number'){S.p[k]=Object.assign(mkP(k),r)}});
    ['quiz','check'].forEach(function(k){if(raw[k]&&typeof raw[k]==='object')S[k]=raw[k]});
    if(raw.am&&raw.am.fresh)S.am=Object.assign(S.am,raw.am);if(raw.lab&&raw.lab.fresh)S.lab=Object.assign(S.lab,raw.lab);
    if(typeof raw.scale==='number')S.scale=Math.min(1.5,Math.max(.85,raw.scale));
    if(PIDS.indexOf(raw.tab)>=0)S.tab=raw.tab;
  }}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(x,d){d=d==null?2:d;return isFinite(x)?(+x.toFixed(d)).toLocaleString('th-TH',{maximumFractionDigits:d}):'–'}
function num(v){var x=parseFloat(v);return isFinite(x)&&x>=0?x:0}
function compute(pid){
  var s=S.p[pid],total=0;s.items.forEach(function(i){total+=num(i.v)});
  var made=num(s.made),unit=made>0?total/made:NaN;
  var step=s.step||5,sug=unit*(1+s.profit/100),rounded=Math.max(step,Math.round(sug/step)*step);
  var manual=s.price!==null&&s.price!==''&&isFinite(parseFloat(s.price));
  var sell=manual?num(s.price):rounded;
  var gpct=unit>0?(sell-unit)/unit*100:NaN;
  var recv=sell*(1-s.fee/100),real=recv-unit,realPct=unit>0?real/unit*100:NaN;
  var need=unit*(1+s.profit/100)/(1-s.fee/100);
  var plan=made>0?(function(){var t=0;DEF[pid].items.forEach(function(i){t+=i[1]});return t/DEF[pid].made})():NaN;

function O(k,pid){
  var c=pid&&S.p[pid]?compute(pid):null,d=pid?DEF[pid]:null;
  switch(k){
    case'total':return fmt(c.total);case'made':return fmt(c.made,0);case'unit':return fmt(c.unit);case'plan':return fmt(c.plan);
    case'lo':return fmt(c.lo);case'hi':return fmt(c.hi);case'sug':return fmt(c.sug);case'profit':return fmt(c.profit,0);case'fee':return fmt(c.fee,0);
    case'sell':return fmt(c.sell);case'mode':return c.manual?'(ตั้งเอง)':'(คำนวณให้)';
    case'profitUnit':return fmt(c.sell-c.unit);case'gpct':return fmt(c.gpct,0);
    case'feeAmt':return fmt(c.sell*c.fee/100);case'recv':return fmt(c.recv);case'real':return fmt(c.real);case'realPct':return fmt(c.realPct,0);case'need':return fmt(c.need);
    case'madeMsg':var df=c.unit-c.plan;return Math.abs(df)<.005?'ตรงตามแผน':(df>0?'แพงขึ้นกระปุกละ '+fmt(df)+' บาท เมื่อเทียบกับแผน':'ถูกลงกระปุกละ '+fmt(-df)+' บาท เมื่อเทียบกับแผน');
    case'amRound':return fmt(S.am[pid].p/Math.max(1,S.am[pid].r));
    case'amUnit':return fmt(S.am[pid].p/Math.max(1,S.am[pid].r)/DEF[pid].made);
    case'labTotal':return fmt(S.lab[pid].n*S.lab[pid].r);
    case'labUnit':return fmt(S.lab[pid].n*S.lab[pid].r/DEF[pid].made);
    case'chk':return String(S.check.filter(Boolean).length);
    case'quizScore':var ok=0,all=0;QUIZ_ALL.forEach(function(q){all++;if(S.quiz[q.id]===q.a)ok++});return ok+' / '+all;
    case'compare':return '';
  }
  return'';
}
function chipFor(kind,pid){
  var c=compute(pid);
  if(kind==='price'){
    if(!(c.unit>0))return['info','ใส่จำนวนที่ขายได้จริงก่อน'];
    if(c.sell<c.unit)return['bad','✕ ต่ำกว่าต้นทุน ขายแล้วขาดทุน'];
    if(c.gpct<29.5)return['warn','! กำไรต่ำกว่า 30% ของต้นทุน'];
    if(c.gpct<=40.5)return['ok','✓ กำไรอยู่ในช่วง 30–40% ที่แนะนำ'];
    return['info','กำไรสูงกว่า 40% ลองถามว่าลูกค้ายอมจ่ายหรือไม่'];
  }
  if(!(c.unit>0))return['info','ใส่จำนวนที่ขายได้จริงก่อน'];
  if(c.real<0)return['bad','✕ หลังหักค่าธรรมเนียม ขาดทุน'];
  if(c.realPct<29.5)return['warn','! กำไรจริงต่ำกว่า 30% ของต้นทุน ควรปรับราคาช่องทางนี้'];
  return['ok','✓ กำไรจริงยังได้ตามเป้า'];
}

function quizHtml(list){

{id:'fee',part:'ช่วงที่ 6 · ตั้งราคา',t:'ขายออนไลน์ มีค่าธรรมเนียม',k:'calc',n:'ลองค่าธรรมเนียม 10% จะเห็นว่ากำไรจริงต่ำกว่าเป้า แล้วดูบรรทัดราคาที่ควรตั้ง ค่า 10% เป็นตัวเลขสมมติ ให้ใช้ค่าจริงของแพลตฟอร์มหรือร้านฝากขาย',h:function(){return'<p class="lead">ช่องทางขายหักค่าธรรมเนียมจากราคาขาย ต้องคิดล่วงหน้า ไม่อย่างนั้นกำไรหาย</p>'+calcBox(S.tab,'fee',true)}},

{id:'compare',part:'ช่วงที่ 7 · ฝึก 2–3 ครบ 3 ผลิตภัณฑ์',t:'เปรียบเทียบ 3 ผลิตภัณฑ์',k:'text',n:'ตารางดึงตัวเลขจากเครื่องคิดเลขของเครื่องนี้ ตัวเลขเริ่มต้นเป็นตัวอย่างสมมติ',h:function(){return compareHtml()+'<p class="small muted">ตัวเลขดึงจากที่กรอกในเครื่องนี้ ค่าเริ่มต้นเป็นตัวเลขสมมติ</p>'}},
{id:'present',part:'ช่วงที่ 7 · ฝึก 2–3 ครบ 3 ผลิตภัณฑ์',t:'เล่าให้เพื่อนฟังกลุ่มละ 1 นาที',k:'cards',n:'กลุ่มละ 1 นาที ปรบมือให้ทุกกลุ่ม สรุปสิ่งที่พบร่วมกัน',h:function(){return cards([['ต้นทุนต่อหน่วยเท่าไร','บอกตัวเลขและวิธีคิด'],['ตั้งราคาเท่าไร เพราะอะไร','กำไรเท่าไร ลูกค้ายอมจ่ายหรือไม่'],['วันนี้เพิ่งนึกได้ว่าลืมนับอะไร','รายการที่ไม่เคยนับมาก่อน']])}},

{id:'summary',part:'ช่วงที่ 8 · สรุป',t:'จำไว้ 4 ข้อ',k:'steps',n:'ให้ทวนพร้อมกัน แล้วเปิดคะแนนตอบถูกของแต่ละคนให้ดูในเครื่องตัวเอง',h:function(){return steps([['จดทุกรายการ ทุกรอบ','วัตถุดิบ บรรจุภัณฑ์ แรงงาน ค่าใช้จ่ายอื่น'],['หารด้วยจำนวนที่ขายได้จริง','ไม่ใช่จำนวนที่ตั้งใจทำ'],['บวกกำไร 30–40% ของต้นทุน แล้วปัดราคา','ดูกำลังซื้อลูกค้าด้วย'],['คิดค่าธรรมเนียมช่องทางขายก่อนตั้งราคา','เพื่อให้กำไรจริงไม่หาย']])+'<p class="callout">คะแนนตอบถูกของท่านในเครื่องนี้: <span class="score" data-o="quizScore"></span></p>'}},
{id:'sheet',part:'ช่วงที่ 8 · สรุป',t:'ใบบันทึกต้นทุนที่ใช้ได้ทุกรอบ',k:'sheet',n:'แนะนำให้ถ่ายภาพหน้านี้ไว้ แล้วจดมือทุกรอบการผลิต หรือกดคัดลอกสรุปของตัวเองไปเก็บในแอปโน้ต',h:function(){return sheetHtml()+'<div><button class="btn" type="button" data-act="copy">คัดลอกสรุปของฉัน</button> <span class="small muted" id="copyMsg" role="status"></span></div>'}},
{id:'end',k:'end',n:'ถามตอบ แล้วแจ้งกำหนดการวันพรุ่งนี้',h:function(){return'<div class="kicker">จบหัวข้อ</div><h1>ขอบคุณ ถามตอบ</h1><p class="lead">พรุ่งนี้ 26 พฤศจิกายน 2569 ช่วงเช้า การตลาดและการขายออนไลน์</p><div class="meta"><b>อ.ดร.วิสุทธร จิตอารี</b><span>คณะบริหารธุรกิจ มหาวิทยาลัยเชียงใหม่</span></div>'}}
];

/* ---------- rendering ---------- */
var stage=document.getElementById('stage'),cur=1,timer={end:0,t:null,left:600};
function head(s){return s.t?(s.part?'<div class="kicker">'+s.part+'</div>':'')+'<h1>'+s.t+'</h1>':''}
function render(n,keepScroll){
  n=Math.min(Math.max(1,n),SL.length);cur=n;var s=SL[n-1],y=window.scrollY;
  stage.innerHTML='<article class="slide k-'+s.k+'">'+head(s)+s.h(s)+'</article>';
  stage.querySelectorAll('.calc').forEach(renderCalc);
  refresh();
  document.title='คิดต้นทุน ตั้งราคา';
  document.getElementById('bNum').textContent=n+' / '+SL.length;
  document.getElementById('bPrev').disabled=n<=1;document.getElementById('bNext').disabled=n>=SL.length;
  document.getElementById('progBar').style.width=(n/SL.length*100)+'%';
  if(s.id==='break')tick();
  if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0);
}
function go(n){n=Math.min(Math.max(1,n),SL.length);if(('#p'+n)===location.hash)render(n);else location.hash='p'+n}
function fromHash(){var m=/^#p(\d+)$/.exec(location.hash);render(m?+m[1]:1)}
window.addEventListener('hashchange',fromHash);

/* timer */
function tick(){var el=document.getElementById('tm');if(!el)return;var l=timer.t?Math.max(0,Math.round((timer.end-Date.now())/1000)):timer.left;
  el.textContent=String(Math.floor(l/60)).padStart(2,'0')+':'+String(l%60).padStart(2,'0');if(timer.t&&l<=0){clearInterval(timer.t);timer.t=null;timer.left=0}}

/* ---------- events ---------- */
var armed={};
document.addEventListener('input',function(e){
  var el=e.target.closest&&e.target.closest('[data-k]');if(!el||!stage.contains(el))return;
  var b=BIND[el.dataset.k];if(!b)return;
  var v=el.dataset.k==='iname'?el.value:el.value;
  b.s(el.dataset.pid,+el.dataset.i,v);save();refresh();
});
document.addEventListener('change',function(e){
  var el=e.target;if(el.dataset&&el.dataset.act==='check'){S.check[+el.dataset.i]=el.checked;for(var i=0;i<CHECKS.length;i++)S.check[i]=!!S.check[i];save();refresh()}
});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,pid=el.dataset.pid;
  if(a==='quiz'){if(S.quiz[el.dataset.q]!==undefined)return;S.quiz[el.dataset.q]=+el.dataset.i;save();render(cur,true);return}
  if(a==='add'){S.p[pid].items.push({n:'รายการเพิ่มเติม',v:0,g:'oth'});save();renderCalc(el.closest('.calc'));refresh();return}
  if(a==='del'){S.p[pid].items.splice(+el.dataset.i,1);save();renderCalc(el.closest('.calc'));refresh();return}
  if(a==='tab'){S.tab=pid;save();render(cur,true);return}
  if(a==='step'){S.p[pid].step=+el.dataset.v;save();refresh();return}
  if(a==='autoPrice'){S.p[pid].price=null;save();refresh();return}
  if(a==='reset'){if(!armed[pid]){armed[pid]=1;el.textContent='กดอีกครั้งเพื่อยืนยัน';setTimeout(function(){armed[pid]=0;if(el.isConnected)el.textContent='เริ่มใหม่ด้วยตัวเลขตัวอย่าง'},3000);return}
    armed[pid]=0;S.p[pid]=mkP(pid);S.am[pid]=mkS().am[pid];S.lab[pid]=mkS().lab[pid];save();var cc=el.closest('.calc');renderCalc(cc);refresh();return}
  if(a==='go'){document.getElementById('toc').hidden=true;go(+el.dataset.n);return}
  if(a==='tstart'){if(timer.t){clearInterval(timer.t);timer.left=Math.max(0,Math.round((timer.end-Date.now())/1000));timer.t=null;el.textContent='เริ่มนับต่อ'}else{if(timer.left<=0)timer.left=600;timer.end=Date.now()+timer.left*1000;timer.t=setInterval(tick,500);el.textContent='หยุดชั่วคราว'}tick();return}
  if(a==='treset'){clearInterval(timer.t);timer.t=null;timer.left=600;tick();var sb=stage.querySelector('[data-act="tstart"]');if(sb)sb.textContent='เริ่มนับ';return}
  if(a==='copy'){var t=summaryText(),m=document.getElementById('copyMsg');
    var done=function(ok){m.textContent=ok?'คัดลอกแล้ว':'คัดลอกไม่ได้ ลองกดค้างที่ข้อความแล้วเลือกคัดลอก'};
    try{navigator.clipboard.writeText(t).then(function(){done(true)},function(){done(false)})}catch(x){done(false)}return}
});
document.getElementById('bPrev').addEventListener('click',function(){go(cur-1)});
document.getElementById('bNext').addEventListener('click',function(){go(cur+1)});
function buildToc(){
  var h='<div><button class="btn" type="button" id="tocClose">ปิดสารบัญ</button>',last='';
  SL.forEach(function(s,i){var p=s.part||(s.id==='end'?'จบ':'');if(p!==last){if(p)h+='<h2>'+p+'</h2>';last=p}
    h+='<button class="it" type="button" data-act="go" data-n="'+(i+1)+'"'+(i+1===cur?' aria-current="true"':'')+'><b>'+(i+1)+'</b><span>'+(s.t||(s.id==='cover'?'หน้าปก':'ขอบคุณ ถามตอบ'))+'</span></button>'});
  var t=document.getElementById('toc');t.innerHTML=h+'</div>';
  document.getElementById('tocClose').addEventListener('click',function(){t.hidden=true});
}
function openToc(){buildToc();document.getElementById('toc').hidden=false}
document.getElementById('bToc').addEventListener('click',openToc);
document.getElementById('bNum').addEventListener('click',openToc);
function applyScale(){document.documentElement.style.setProperty('--s',S.scale)}
document.getElementById('bSm').addEventListener('click',function(){S.scale=Math.max(.85,+(S.scale-.1).toFixed(2));applyScale();save()});
document.getElementById('bLg').addEventListener('click',function(){S.scale=Math.min(1.5,+(S.scale+.1).toFixed(2));applyScale();save()});
document.addEventListener('keydown',function(e){
  if(e.target.matches&&e.target.matches('input,select,textarea'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '&&e.target===document.body){e.preventDefault();go(cur+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)}
  else if(e.key==='Escape'){document.getElementById('toc').hidden=true}
});
applyScale();fromHash();
})();
</script>

</body></html>
